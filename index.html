<!-- FIX: stary projekt Supabase (thsqpnmvfkawaxyeitcv) został usunięty. Ten shim przepisuje
     wszystkie zahardkodowane URL-e obrazów na nowy projekt (thsqpnmvfkawaxyeitcv) w locie. -->
<script>
(function () {
  var OLD = 'thsqpnmvfkawaxyeitcv.supabase.co';
  var NEW = 'thsqpnmvfkawaxyeitcv.supabase.co';
  function fixEl(e) {
    if (!e || e.nodeType !== 1) return;
    if (e.tagName === 'IMG') {
      var s = e.getAttribute('src');
      if (s && s.indexOf(OLD) > -1) e.setAttribute('src', s.split(OLD).join(NEW));
    }
    var st = e.getAttribute && e.getAttribute('style');
    if (st && st.indexOf(OLD) > -1) e.setAttribute('style', st.split(OLD).join(NEW));
  }
  function scan(root) {
    try { if (root.querySelectorAll) root.querySelectorAll('img,[style]').forEach(fixEl); } catch (err) {}
  }
  var mo = new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      fixEl(m.target);
      if (m.addedNodes) m.addedNodes.forEach(function (n) { if (n.nodeType === 1) { fixEl(n); scan(n); } });
    });
  });
  document.addEventListener('DOMContentLoaded', function () {
    scan(document);
    mo.observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ['src', 'style'] });
  });
})();
</script>
